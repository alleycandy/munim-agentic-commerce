services:
  db:
    image: postgres:16-alpine
    container_name: munim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: munim
      POSTGRES_USER: munim
      POSTGRES_PASSWORD: munim
    ports:
      - "5432:5432"
    volumes:
      - munim-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munim -d munim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  munim-db-data:
